version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DB_TYPE=mysql
    volumes:
      - ./.env:/app/.env
      - ./static/uploads:/app/static/uploads
    restart: always
    command: sh -c "sleep 15 && python app-mysql.py"
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=sales_db
      - MYSQL_USER=sales_user
      - MYSQL_PASSWORD=sales_pass
    volumes:
      - /home/ych/data/hexing/mysql-data:/var/lib/mysql
    restart: always
